<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ตารางงานก่อสร้างทั้งหมด · CROD GRID CARE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#183747;font:16px/1.55 "Noto Sans Thai",Tahoma,sans-serif}main{max-width:1700px;margin:auto;padding:clamp(16px,3vw,44px)}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:clamp(24px,3vw,36px);margin:0}a,button{color:#076b70}section{overflow:auto;background:white;border-radius:12px;border:1px solid #cfdee3}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px 12px;text-align:left;border-bottom:1px solid #dfebee}th{background:#e8f3f3}td:nth-child(2),td:last-child{white-space:nowrap}button{cursor:pointer;background:white;border:1px solid #b8cfd1;border-radius:6px;padding:7px 10px;font:inherit}dialog{max-width:min(820px,94vw);max-height:88vh;border:1px solid #c1d6da;border-radius:12px;padding:22px}dialog::backdrop{background:#112e3d88}dl{display:grid;grid-template-columns:minmax(90px,1fr) 3fr;gap:10px 16px}dd{white-space:pre-wrap;margin:0}dt{font-weight:bold}dialog form{display:flex;justify-content:flex-end;gap:8px}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.toolbar p{margin:0}.toolbar input{flex:1;min-width:12em;font:inherit;color:inherit;padding:8px 12px;border:1px solid #b8cfd1;border-radius:6px}
th button{display:inline-flex;align-items:center;gap:4px;border:0;padding:0;background:none;color:inherit;text-align:left;font-weight:700}
th button::after{content:'↕';color:#52777a;font-size:.8em}th[aria-sort=ascending] button::after{content:'▲'}th[aria-sort=descending] button::after{content:'▼'}
:focus-visible{outline:2px solid #087f83;outline-offset:2px}
#close-report{margin-left:auto;background:#087f83;color:white;border-color:#087f83;border-radius:10px;padding:12px 20px;font-weight:700;white-space:nowrap}#close-report:hover,#close-report:focus-visible{outline:5px solid #ef2929;outline-offset:0}
</style></head><body><main><header><h1>ตารางงานก่อสร้างทั้งหมด</h1><a id="dashboard-link" hidden></a><button type="button" id="close-report" aria-label="ปิดตารางงานก่อสร้าง" style="background:#087f83;color:#fff;border-color:#087f83;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap">ปิด <span aria-hidden="true">×</span></button></header><div class="toolbar"><p id="count" role="status">กำลังโหลดรายการ…</p><input type="search" id="report-search" aria-label="ค้นหางานก่อสร้าง" placeholder="ค้นหา Job No. สถานี หรืองานก่อสร้าง" autocomplete="off"><button id="clear-search" type="button" hidden>ล้างคำค้น</button></div><section><table id="report-table"><thead><tr><th>ลำดับในรายงาน</th><th>Job No.</th><th>สถานี / งานก่อสร้าง</th><th>ประเภทงาน</th><th>กำหนดเสร็จ</th><th>ส่วนต่าง (%)</th><th>เทียบกับแผน</th><th>ผลงานรวม (%)</th><th>โยธา (%)</th><th>ไฟฟ้า (%)</th><th>รายละเอียด</th></tr></thead><tbody></tbody></table></section><dialog><h2>ข้อมูลงานก่อสร้าง</h2><dl></dl><form method="dialog"><button type="button" data-edit hidden>แก้ไขรายการ</button><button style="background:#087f83;color:#fff;border-color:#087f83;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap">ปิด <span aria-hidden="true">×</span></button></form></dialog></main><script type="module" src="construction-report.js?v=20261111-columns-close"></script></body></html>
